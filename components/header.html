<header class="site-header bg-white h-16 border-b border-slate-200 flex items-center justify-between sticky top-0 z-10 flex-shrink-0">
  <div class="flex items-center gap-2 min-w-0">
    <button type="button" id="sidebar-toggle" aria-label="Mở menu" aria-controls="app-sidebar" aria-expanded="false" class="sidebar-toggle">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    <h1 id="header-title" class="header-title text-lg font-bold text-slate-800">Tổng quan</h1>
  </div>

  <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
    <!-- Số dư khả dụng (script.js cập nhật qua id) -->
    <div class="balance-chip flex items-center gap-1.5 bg-red-50 border border-red-100 px-3 py-1.5 rounded-full text-red-500 font-semibold text-sm" title="Số dư khả dụng">
      <i data-lucide="disc" class="w-3.5 h-3.5 fill-red-500"></i>
      <span id="header-balance">đ0</span>
    </div>

    <!-- Đã thêm ID để JS cập nhật tên -->
    <span id="header-username" class="header-user-name font-semibold text-sm text-slate-700 ml-1">Khách</span>

    <!-- Đã thêm ID để JS cập nhật Avatar (chữ cái đầu) -->
    <div id="header-avatar" class="w-9 h-9 rounded-full bg-[#18253f] text-white font-bold text-xs flex items-center justify-center uppercase">
      ?
    </div>

    <!-- Nút đăng xuất -->
    <button data-action="logout" class="w-9 h-9 rounded-full border border-red-100 bg-red-50 flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white ml-1 transition" title="Đăng xuất">
      <i data-lucide="log-out" class="w-4 h-4"></i>
    </button>
  </div>
</header>
