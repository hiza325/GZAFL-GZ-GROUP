<main class="p-8 max-w-6xl mx-auto animation-fade-in">
  
  <!-- Header của trang con -->
  <div class="mb-8">
    <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Ví hoàn tiền</h2>
  </div>

  <!-- Thẻ số dư (Dark Card) -->
  <div class="deco-grid bg-[#18253f] text-white rounded-[2rem] p-8 mb-8 relative overflow-hidden shadow-lg shadow-blue-900/10">
    <div class="absolute -right-10 -top-10 w-48 h-48 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute right-20 -bottom-10 w-32 h-32 bg-blue-500/10 rounded-full blur-xl pointer-events-none"></div>

    <div class="relative z-10 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
      <div>
        <!-- Đã đưa số "đ0" lên trên và tiêu đề xuống dưới -->
        <div class="text-4xl font-extrabold tracking-tight" id="wallet-balance">đ0</div>
        <div class="text-[11px] font-bold text-slate-300 flex items-center gap-2 uppercase tracking-wider mt-2">
          <i data-lucide="wallet" class="w-4 h-4 text-slate-400"></i>
          Số dư hoa hồng khả dụng
        </div>
        <div class="wallet-meta">
          <span id="wallet-hold-note" class="wallet-chip wallet-chip-hold hidden"></span>
          <span id="wallet-debt-note" class="wallet-chip wallet-chip-debt hidden"></span>
        </div>
      </div>
      
      <button data-action="withdraw" class="bg-white/10 hover:bg-white/20 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 transition-all text-xs font-semibold border border-white/10 backdrop-blur-sm shadow-sm active:scale-[0.98]">
        <i data-lucide="banknote" class="w-4 h-4"></i>
        Rút tiền
      </button>
    </div>

    <!-- Thống kê động có ID -->
    <div class="relative z-10 grid grid-cols-2 md:grid-cols-4 gap-6 mt-8 pt-6 border-t border-white/10">
      
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-slate-300">
          <i data-lucide="file-text" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-lg font-bold" id="stat-total-orders">0</div>
          <div class="text-xs text-slate-400 font-medium">Tổng đơn</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-lg font-bold" id="stat-completed-orders">0</div>
          <div class="text-xs text-slate-400 font-medium">Hoàn thành</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-400">
          <i data-lucide="loader-2" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-lg font-bold" id="stat-pending-orders">0</div>
          <div class="text-xs text-slate-400 font-medium">Đang xử lý</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-500/10 flex items-center justify-center text-purple-400">
          <i data-lucide="credit-card" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-lg font-bold" id="stat-paid-orders">0</div>
          <div class="text-xs text-slate-400 font-medium">Đã thanh toán</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Phần Lịch sử giao dịch -->
  <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-50">
      <h3 class="text-xl font-bold text-slate-800">Lịch sử giao dịch</h3>
      <span class="text-xs font-semibold text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full" id="tx-count">0 giao dịch</span>
    </div>

    <div id="tx-container">
      <!-- Trạng thái trống (Chưa có giao dịch rút tiền) -->
      <div class="py-12 flex flex-col items-center justify-center text-center">
        <div class="empty-orb w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-5 shadow-inner border border-slate-100">
          <i data-lucide="receipt" class="w-10 h-10 text-slate-300"></i>
        </div>
        <h4 class="text-lg font-bold text-slate-800 mb-2">Chưa có lịch sử giao dịch</h4>
        <p class="text-slate-500 text-sm max-w-sm leading-relaxed">
          Bạn chưa thực hiện lệnh rút tiền nào. Các giao dịch rút tiền của bạn sẽ được hiển thị chi tiết tại đây.
        </p>
      </div>
    </div>
  </div>

</main>
