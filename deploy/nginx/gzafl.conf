# ---------------------------------------------------------------
# GZ AFL - Nginx reverse proxy (HTTP -> HTTPS)
#
# Cài đặt:
#   sudo cp deploy/nginx/gzafl.conf /etc/nginx/sites-available/gzafl.conf
#   sudo sed -i 's/gzafl\.vn/ten-mien-cua-ban.com/g' /etc/nginx/sites-available/gzafl.conf
#   sudo ln -s /etc/nginx/sites-available/gzafl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ten-mien-cua-ban.com -d www.ten-mien-cua-ban.com
#
# LƯU Ý THỨ TỰ: file này cần chứng chỉ đã tồn tại. Nếu chưa có, làm theo
# hướng dẫn trong `gzafl-bootstrap.conf` trước (xin cert bằng HTTP), rồi
# mới thay bằng file này.
#
# BẮT BUỘC cài kèm log format (nếu thiếu, nginx -t báo "unknown log format"):
#   sudo cp deploy/nginx/00-log-format.conf /etc/nginx/conf.d/00-gzafl-log.conf
# ---------------------------------------------------------------

# Giới hạn cơ bản chống dò mật khẩu / spam API (tuỳ chọn, có thể bỏ)
limit_req_zone $binary_remote_addr zone=gzafl_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gzafl.vn www.gzafl.vn;

    # Cho phép Let's Encrypt xác thực domain
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Cú pháp này chạy được trên cả nginx cũ (Ubuntu 22.04) và mới.
    # nginx >= 1.25 sẽ in cảnh báo "listen ... http2 is deprecated" - vẫn hoạt động.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gzafl.vn www.gzafl.vn;

    ssl_certificate     /etc/letsencrypt/live/gzafl.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gzafl.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Ảnh đại diện / QR gửi dạng base64, tối đa ~6MB JSON
    client_max_body_size 8m;

    # Nén ở proxy; Node đã nén sẵn nên Nginx sẽ không nén lần hai.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Không ghi query string vào access log (postback có thể chứa secret).
    # Nếu mạng affiliate gửi secret qua header X-Postback-Secret thì không cần lo,
    # nhưng vẫn nên dùng log format an toàn này.
    access_log /var/log/nginx/gzafl.access.log gzafl_safe;

    # --- API -----------------------------------------------------
    location /api/ {
        limit_req zone=gzafl_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    65s;   # chatbot AI có thể trả lời lâu
        proxy_send_timeout    65s;
    }

    # --- Nhận postback: tắt access log, không giới hạn rate ------
    location /api/postback/ {
        access_log off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Link hoàn tiền rút gọn (/r/<mã đơn>) --------------------
    location /r/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Giao diện + ảnh + file tĩnh -----------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh tải lên: cho cache nhẹ (tên file có timestamp nên không sợ cũ)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tên file có timestamp nên cache dài không sợ ảnh cũ
        expires 7d;
    }
}
