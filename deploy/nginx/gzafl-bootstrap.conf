# ---------------------------------------------------------------
# GZ AFL - Nginx "bootstrap": chỉ HTTP, dùng MỘT LẦN để xin chứng chỉ.
#
# Vì sao cần file này: cấu hình HTTPS đầy đủ (gzafl.conf) tham chiếu tới
# file chứng chỉ chưa tồn tại -> nginx -t sẽ báo lỗi. Trình tự đúng là:
#
#   1) sudo cp deploy/nginx/gzafl-bootstrap.conf /etc/nginx/sites-available/gzafl.conf
#      sudo sed -i 's/gzafl\.vn/ten-mien-cua-ban.com/g' /etc/nginx/sites-available/gzafl.conf
#      sudo ln -sf /etc/nginx/sites-available/gzafl.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#   2) sudo certbot certonly --webroot -w /var/www/html \
#           -d ten-mien-cua-ban.com -d www.ten-mien-cua-ban.com
#
#   3) Thay bằng cấu hình HTTPS đầy đủ:
#      sudo cp deploy/nginx/gzafl.conf /etc/nginx/sites-available/gzafl.conf
#      sudo sed -i 's/gzafl\.vn/ten-mien-cua-ban.com/g' /etc/nginx/sites-available/gzafl.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# Sau đó xóa/đổi tên file bootstrap này để không load trùng.
# ---------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name gzafl.vn www.gzafl.vn;

    # Let's Encrypt đọc file thử thách tại đây
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
