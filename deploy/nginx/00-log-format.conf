# ---------------------------------------------------------------
# GZ AFL - log format không ghi query string
#
# Cài đặt (đặt TRƯỚC khi include sites-enabled):
#   sudo cp deploy/nginx/00-log-format.conf /etc/nginx/conf.d/00-gzafl-log.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Vì sao: mạng affiliate thường gửi POSTBACK_SECRET trong query string
# (?secret=...). Log mặc định "combined" ghi cả query -> lộ khoá.
# Format dưới đây chỉ ghi $uri (không có query).
# ---------------------------------------------------------------

log_format gzafl_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
